<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background-color: #1e293b;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Lado Esquerdo - Painel de Produtividade */
        .sidebar {
            flex: 1;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        .sidebar h1 {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
        }

        .sidebar p {
            color: #bfdbfe;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        /* Lado Direito - Formulário de Login */
        .form-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
            background-color: #1e293b;
        }

        .form-header {
            margin-bottom: 30px;
        }

        .form-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background-color: #334155;
            border: 2px solid transparent;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #1e293b;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            cursor: pointer;
        }

        .forgot-password {
            color: #3b82f6;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: #2563eb;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: #1d4ed8;
        }

        .form-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .form-footer a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        /* Responsividade para Dispositivos Móveis */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                max-width: 450px;
                margin: 20px;
            }

            .sidebar {
                padding: 30px;
                text-align: center;
            }

            .sidebar h1 {
                font-size: 1.8rem;
            }

            .form-container {
                padding: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
      
        <div class="sidebar">
            <h1>Organize a sua rotina num clique.</h1>
            <p>Faça login para gerir as suas tarefas diárias, definir prazos e aumentar a sua produtividade.</p>
        </div>

        
        <div class="form-container">
            <div class="form-header">
                <h2>Bem-vindo de volta!</h2>
                <p>Introduza as suas credenciais para aceder à sua conta.</p>
            </div>

           <form id="loginForm" onsubmit="redirecionarDireto(event)">
    <div class="input-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="exemplo@email.com" required>
    </div>

    <div class="input-group">
        <label for="password">Palavra-passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <div class="form-actions">
        <label class="remember-me">
            <input type="checkbox"> Lembrar-me
        </label>
        <a href="#" class="forgot-password">Esqueceu-se da palavra-passe?</a>
    </div>

    <button type="submit" class="btn-login">Entrar</button>
</form>
<script>
    function redirecionarDireto(event) {
        event.preventDefault(); // Impede o bloqueio da página
        
        // Salva um token fictício para uso no painel
        localStorage.setItem('userToken', 'login_confirmado_local');
        
        // Força o navegador a ir direto para o dashboard
        window.location.href = "dashboard.html";
    }
</script>
</body>
</html>
