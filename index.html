<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gerenciador de Tarefas - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            background: #020617;
        }

        body {
            background-color: #1e293b;
            color: #f8fafc;
            max-width: 480px;
            margin: 0 auto !important;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
            box-shadow: 0 0 60px rgba(0, 0, 0, .6);
        }

        input {
            font-size: 16px !important;
            user-select: text;
            -webkit-user-select: text;
        }

        button, a {
            touch-action: manipulation;
        }

        button:active, .btn-login:active {
            transform: scale(.96);
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100dvh;
        }

        .sidebar {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            padding: calc(56px + env(safe-area-inset-top)) 28px 40px;
            border-radius: 0 0 32px 32px;
        }

        .sidebar h1 {
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .sidebar p {
            color: #bfdbfe;
            font-size: 1rem;
            line-height: 1.5;
        }

        .form-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 32px 24px calc(24px + env(safe-area-inset-bottom));
        }

        .form-header {
            margin-bottom: 24px;
        }

        .form-header h2 {
            font-size: 1.6rem;
            margin-bottom: 6px;
        }

        .form-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            background-color: #334155;
            border: 2px solid transparent;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #1e293b;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            cursor: pointer;
        }

        .forgot-password {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: #2563eb;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-register {
            display: block;
            text-align: center;
            text-decoration: none;
            margin-top: 12px;
            padding: 14px;
            border-radius: 14px;
            border: 2px solid #2563eb;
            color: #60a5fa;
            font-weight: 600;
            font-size: 1rem;
        }

        .form-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="sidebar">
            <h1>Organize sua rotina em um clique.</h1>
            <p>Faça login para gerenciar suas tarefas diárias, prazos e produtividade.</p>
        </div>

        <div class="form-container">
            <div class="form-header">
                <h2>Bem-vindo de volta!</h2>
                <p>Insira suas credenciais para acessar sua conta.</p>
            </div>

            <form id="loginForm" onsubmit="redirecionarDireto(event)">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="esqueci-senha.html" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>

            <div class="form-footer">Ainda não tem conta?</div>
            <a href="registrar.html" class="btn-register">Registrar</a>
        </div>
    </div>

    <script>
        function redirecionarDireto(event) {
            event.preventDefault();
            localStorage.setItem('userToken', 'login_confirmado_local');
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
