<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gerenciador de Tarefas - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html { background: #020617; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: stretch;
            min-height: 100vh;
            min-height: 100dvh;
            max-width: 480px;
            margin: 0 auto;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 60px rgba(0,0,0,.6);
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100dvh;
            background-color: #1e293b;
        }

        .sidebar {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: calc(56px + env(safe-area-inset-top)) 28px 40px;
            border-radius: 0 0 32px 32px;
        }

        .sidebar h1 {
            font-size: 1.7rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 12px;
        }

        .sidebar p {
            color: #bfdbfe;
            font-size: 1rem;
            line-height: 1.5;
        }

        .form-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 32px 24px calc(24px + env(safe-area-inset-bottom));
            background-color: #1e293b;
        }

        .form-header {
            margin-bottom: 24px;
        }

        .form-header h2 {
            font-size: 1.6rem;
            margin-bottom: 6px;
        }

        .form-header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background-color: #334155;
            border: 2px solid transparent;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            border-color: #2563eb;
            background-color: #1e293b;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 0.85rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            cursor: pointer;
        }

        .forgot-password {
            color: #3b82f6;
            text-decoration: none;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background-color: #2563eb;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-login:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Organize a sua rotina num clique.</h1>
            <p>Faça login para gerir as suas tarefas diárias, definir prazos e aumentar a sua produtividade.</p>
        </div>

        <div class="form-container">
            <div class="form-header">
                <h2>Bem-vindo de volta!</h2>
                <p>Introduza as suas credenciais para aceder à sua conta.</p>
            </div>

            <form id="loginForm" onsubmit="redirecionarDireto(event)">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="exemplo@email.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#" class="forgot-password">Esqueceu-se da palavra-passe?</a>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
    </div>

    <script>
        function redirecionarDireto(event) {
            event.preventDefault();
            localStorage.setItem('userToken', 'login_confirmado_local');
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
