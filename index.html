<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <div class="tarefas">
            <h1>Organize sua rotina em um clique.</h1>
            <p>Faça login para gerir as suas tarefas diárias, definir prazos e aumentar a sua produtividade.</p>
        </div>
        <div class="form-container">
            <div class="form-header"></div>
            <h2> Bem vindo de volta!</h2>
            <p>Introduza as suas credenciais para aceder à sua conta.</p>
        </div>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="Email">Email</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="input-group">
                    <label for="password">Palavra-passe</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                  <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox"> Lembrar-me
                    </label>
                    <a href="#" class="forgot-password">Esqueceu-se da palavra-passe?</a>
                </div>
                <button type="submit">Entrar</button>
        </form>
        <div class="form-footer">
                Não tem uma conta? <a href="#">Registe-se aqui</a>
            </div>
    </div>
    <script src="tarefas.js"></script>
</body>
</html>
