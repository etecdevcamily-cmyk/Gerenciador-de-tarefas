<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Gerenciador de Tarefas - Recuperar Senha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html {
            background: #020617;
        }

        body {
            background: #1e293b;
            color: #f8fafc;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100dvh;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 60px rgba(0,0,0,.6);
        }

        .top {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            padding: calc(24px + env(safe-area-inset-top)) 24px 36px;
            border-radius: 0 0 32px 32px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(255,255,255,.15);
            color: #fff;
            text-decoration: none;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .top h1 {
            font-size: 1.7rem;
            margin-bottom: 8px;
        }

        .top p {
            color: #bfdbfe;
            line-height: 1.4;
        }

        .content {
            padding: 28px 24px calc(24px + env(safe-area-inset-bottom));
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: .9rem;
        }

        input {
            width: 100%;
            padding: 13px 16px;
            background: #334155;
            border: 2px solid transparent;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            background: #1e293b;
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .btn:active {
            transform: scale(.96);
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #94a3b8;
            font-size: .9rem;
        }

        .footer a {
            color: #3b82f6;
            font-weight: 600;
            text-decoration: none;
        }

        .ok {
            display: none;
            text-align: center;
            background: #334155;
            border-radius: 16px;
            padding: 24px;
        }

        .ok .ic {
            font-size: 2.4rem;
            margin-bottom: 10px;
        }

        .ok h2 {
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .ok p {
            color: #cbd5e1;
            margin: 8px 0 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="top">
        <a href="index.html" class="back" aria-label="Voltar">&#8592;</a>
        <h1>Esqueceu sua senha?</h1>
        <p>Informe o seu e-mail cadastrado e enviaremos o link de recuperação.</p>
    </div>

    <div class="content">
        <form id="form" onsubmit="enviar(event)">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="exemplo@email.com" required>
            </div>
            <button type="submit" class="btn">Enviar link de recuperação</button>
        </form>

        <div class="ok" id="ok">
            <div class="ic">✉️</div>
            <h2>Verifique seu e-mail</h2>
            <p>Se houver uma conta associada a <b id="em"></b>, você receberá as instruções para redefinir sua senha.</p>
            <a href="index.html" class="btn" style="display:block;text-decoration:none;">Voltar ao Login</a>
        </div>

        <div class="footer">Lembrou a senha? <a href="index.html">Entrar</a></div>
    </div>

    <script>
        function enviar(e) {
            e.preventDefault();
            document.getElementById('em').textContent = document.getElementById('email').value;
            document.getElementById('form').style.display = 'none';
            document.getElementById('ok').style.display = 'block';
        }
    </script>
</body>
</html>
