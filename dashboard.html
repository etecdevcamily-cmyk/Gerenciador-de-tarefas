<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas - TaskFlow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
        }
        /* Barra Lateral de Navegação */
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid #334155;
            position: fixed;
            height: 100vh;
            z-index: 10;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .nav-item a {
            display: block;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
        }
        .nav-item.active a, .nav-item a:hover {
            background-color: #334155;
            color: #fff;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background-color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }
        .user-info .name {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .user-info .logout {
            font-size: 0.8rem;
            color: #ef4444;
            text-decoration: none;
        }
        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            margin-left: 260px;
        }
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 1.8rem;
        }
        .btn-add {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-add:hover {
            background-color: #1d4ed8;
        }
        /* Cards de Resumo/Estatísticas */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .stat-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        .stat-card h3 {
            font-size: 1.8rem;
        }
        /* Quadro Organizador (Estilo Kanban) */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            align-items: start;
        }
        .column {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #334155;
            min-height: 400px;
            transition: background-color 0.2s;
        }
        .column.drag-over {
            background-color: #334155;
            border-color: #2563eb;
        }
        .column-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 350px;
        }
        /* Cartão de Tarefa Individual */
        .task-card {
            background-color: #334155;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: grab;
            transition: transform 0.2s, opacity 0.2s;
            position: relative;
        }
        .task-card:active {
            cursor: grabbing;
        }
        .task-card:hover {
            transform: translateY(-2px);
        }
        .task-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            padding-right: 24px;
        }
        .task-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
        .badge-alta { background-color: #7f1d1d; color: #fca5a5; }
        .badge-media { background-color: #7c2d12; color: #fed7aa; }
        .badge-baixa { background-color: #064e3b; color: #a7f3d0; }
        .task-date { color: #94a3b8; }
        
        .btn-delete {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 1rem;
            display: none;
        }
        .task-card:hover .btn-delete {
            display: block;
        }

        /* Modal Formulário de Tarefa */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #334155;
        }
        .modal-header {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }
        .btn-cancel {
            background-color: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-save {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Responsividade */
        @media (max-width: 1024px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid #334155; padding: 16px; }
            .main-content { margin-left: 0; padding: 20px; }
            .logo { margin-bottom: 16px; }
            .nav-links { flex-direction: row; overflow-x: auto; }
            .board { grid-template-columns: 1fr; }
            .user-profile { display: none; }
        }
    </style>
</head>
<body>

    <!-- Barra Lateral -->
    <aside class="sidebar">
        <div>
            <div class="logo">
                <span>📝</span> TaskFlow
            </div>
            <ul class="nav-links">
                <li class="nav-item active" data-target="quadro"><a onclick="switchView('quadro')">O Meu Quadro</a></li>
                <li class="nav-item" data-target="calendario"><a onclick="switchView('calendario')">Calendário</a></li>
                <li class="nav-item" data-target="configuracoes"><a onclick="switchView('configuracoes')">Configurações</a></li>
            </ul>
        </div>
        <div class="user-profile">
            <div class="avatar">U</div>
            <div class="user-info">
                <div class="name">Utilizador</div>
                <a href="#" class="logout" onclick="alert('Sessão terminada.')">Sair do sistema</a>
            </div>
        </div>
    </aside>

    <!-- Conteúdo Principal -->
    <main class="main-content">
        
        <!-- SECÇÃO: QUADRO KANBAN -->
        <section id="view-quadro" class="view-section active">
