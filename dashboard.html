<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas - Painel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
        }

        /* Barra Lateral de Navegação */
        .sidebar {
            width: 260px;
            background-color: #1e293b;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid #334155;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #3b82f6;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item a {
            display: block;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item.active a, .nav-item a:hover {
            background-color: #334155;
            color: #fff;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
        }

        .user-info .name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        .user-info .logout {
            font-size: 0.8rem;
            color: #ef4444;
            text-decoration: none;
        }

        /* Conteúdo Principal */
        .main-content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-size: 1.8rem;
        }

        .btn-add {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #1d4ed8;
        }

        /* Cards de Resumo/Estatísticas */
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .stat-card p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .stat-card h3 {
            font-size: 1.8rem;
        }

        /* Quadro Organizador (Estilo Kanban) */
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
            align-items: start;
        }

        .column {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #334155;
            min-height: 400px;
        }

        .column-header {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Cartão de Tarefa Individual */
        .task-card {
            background-color: #334155;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            cursor: grab;
            transition: transform 0.2s;
        }

        .task-card:hover {
            transform: translateY(-2px);
        }

        .task-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .task-desc {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-alta { background-color: #7f1d1d; color: #fca5a5; }
        .badge-media { background-color: #7c2d12; color: #fed7aa; }
        .badge-baixa { background-color: #064e3b; color: #a7f3d0; }

        .task-date {
            color: #94a3b8;
        }

        /* Responsividade */
        @media (max-width: 1024px) {
            .board {
                grid-template-columns: 1fr;
            }
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid #334155;
            }
            .logo { margin-bottom: 20px; }
            .nav-links { flex-direction: row; overflow-x: auto; padding-bottom: 10px; }
            .user-profile { display: none; }
        }
    
        .task-actions{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
        .task-actions button{flex:1;border:none;border-radius:6px;padding:6px 8px;font-size:.75rem;font-weight:600;cursor:pointer;background:#1e293b;color:#cbd5e1}
        .task-actions button:hover{background:#0f172a;color:#fff}
        .task-actions .del:hover{background:#7f1d1d;color:#fca5a5}
        .task-actions .done:hover{background:#064e3b;color:#a7f3d0}
        .empty{color:#64748b;font-size:.85rem;text-align:center;padding:20px 0}
        .task-card.concluida{opacity:.7}
        .task-card.concluida .task-title{text-decoration:line-through}
    </style>
</head>
<body>
    <aside class="sidebar">
        <div>
            <div class="logo"><span>📝</span> Tarefas</div>
            <ul class="nav-links">
                <li class="nav-item active"><a href="dashboard.html">O Meu Quadro</a></li>
                <li class="nav-item"><a href="nova-tarefa.html">Nova Tarefa</a></li>
                <li class="nav-item"><a href="#">Configurações</a></li>
            </ul>
        </div>
        <div class="user-profile">
            <div class="avatar">U</div>
            <div class="user-info">
                <div class="name">Utilizador</div>
                <a href="index.html" class="logout">Sair do sistema</a>
            </div>
        </div>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1>Minhas Tarefas</h1>
            <button class="btn-add" onclick="location.href='nova-tarefa.html'">+ Nova Tarefa</button>
        </header>
        <section class="stats-container">
            <div class="stat-card"><p>Total de Tarefas</p><h3 id="stTotal">0</h3></div>
            <div class="stat-card"><p>Em Progresso</p><h3 id="stProg" style="color:#f59e0b;">0</h3></div>
            <div class="stat-card"><p>Concluídas</p><h3 id="stDone" style="color:#10b981;">0</h3></div>
        </section>
        <section class="board">
            <div class="column"><div class="column-header"><span>A Fazer</span><span id="c-afazer">0</span></div><div class="task-list" id="l-afazer"></div></div>
            <div class="column"><div class="column-header"><span>Em Progresso</span><span id="c-progresso">0</span></div><div class="task-list" id="l-progresso"></div></div>
            <div class="column"><div class="column-header"><span>Concluído</span><span id="c-concluido">0</span></div><div class="task-list" id="l-concluido"></div></div>
        </section>
    </main>
<script>
const KEY = "taskflow_tarefas";
function carregar() {
    const salvo = localStorage.getItem(KEY);
    if (salvo) return JSON.parse(salvo);
    // Tarefas de exemplo na primeira vez
    const ex = [
        {id:1,titulo:"Desenhar Banco de Dados",descricao:"Modelar as tabelas de utilizadores e tarefas para o sistema.",prioridade:"alta",data:"",status:"afazer"},
        {id:2,titulo:"Criar Interface Frontend",descricao:"Construir o HTML e CSS das páginas organizadoras e de login.",prioridade:"media",data:"",status:"progresso"},
        {id:3,titulo:"Brainstorming de Ideias",descricao:"Definir o escopo inicial e o tema do projeto para o portfólio.",prioridade:"baixa",data:"",status:"concluido"}
    ];
    localStorage.setItem(KEY, JSON.stringify(ex));
    return ex;
}
function salvar(t){ localStorage.setItem(KEY, JSON.stringify(t)); }
function esc(s){ const d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }
const nomePrio = {alta:"Alta",media:"Média",baixa:"Baixa"};
function fmtData(d){ if(!d) return "Sem prazo"; const [a,m,dia]=d.split("-"); return dia+"/"+m+"/"+a; }

function render() {
    const tarefas = carregar();
    ["afazer","progresso","concluido"].forEach(s => {
        const lista = document.getElementById("l-"+s);
        const doStatus = tarefas.filter(t => t.status === s);
        document.getElementById("c-"+s).textContent = doStatus.length;
        lista.innerHTML = doStatus.length ? "" : '<div class="empty">Nenhuma tarefa</div>';
        doStatus.forEach(t => {
            const card = document.createElement("div");
            card.className = "task-card" + (s==="concluido" ? " concluida" : "");
            card.innerHTML = `
                <div class="task-title">${esc(t.titulo)}</div>
                <div class="task-desc">${esc(t.descricao)}</div>
                <div class="task-meta">
                    <span class="badge badge-${t.prioridade}">${nomePrio[t.prioridade]}</span>
                    <span class="task-date">${fmtData(t.data)}</span>
                </div>
                <div class="task-actions">
                    ${s==="afazer" ? `<button onclick="mudar(${t.id},'progresso')">▶ Iniciar</button>` : ""}
                    ${s!=="concluido" ? `<button class="done" onclick="mudar(${t.id},'concluido')">✔ Feita</button>` : `<button onclick="mudar(${t.id},'afazer')">↺ Reabrir</button>`}
                    <button onclick="location.href='nova-tarefa.html?id=${t.id}'">✎ Editar</button>
                    <button class="del" onclick="excluir(${t.id})">🗑 Excluir</button>
                </div>`;
            lista.appendChild(card);
        });
    });
    document.getElementById("stTotal").textContent = tarefas.length;
    document.getElementById("stProg").textContent = tarefas.filter(t=>t.status==="progresso").length;
    document.getElementById("stDone").textContent = tarefas.filter(t=>t.status==="concluido").length;
}
function mudar(id, status){ const t=carregar(); t.find(x=>x.id===id).status=status; salvar(t); render(); }
function excluir(id){ if(!confirm("Excluir esta tarefa?")) return; salvar(carregar().filter(x=>x.id!==id)); render(); }
render();
</script>
</body>
</html>
